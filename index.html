<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <meta name="referrer" content="no-referrer">
    
    <!-- 과거 PC 확장 프로그램에서 검증된 모질라 공식 Readability 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/readability/0.5.0/Readability.min.js"></script>

    <title>REAL READ - 3줄 몰입 리더</title>
    <style>
        :root {
            --font-size: 1.35rem;
            --line-height: 2.1;
            --reader-width: 760px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
            padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
            user-select: none;
        }

        #input-section {
            width: 100%;
            max-width: var(--reader-width);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: max-width 0.05s ease-out;
        }

        .input-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #64748b;
        }

        #custom-text {
            width: 100%;
            height: 70px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            font-size: 0.9rem;
            line-height: 1.45;
            color: #1e293b;
            resize: vertical;
            outline: none;
            user-select: auto;
        }

        #custom-text:focus {
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        .action-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            align-items: center;
        }

        .sub-btn {
            padding: 7px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #334155;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .sub-btn:active { background: #f1f5f9; }

        #install-app-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #ffffff;
            border: 1px solid #0f172a;
        }

        #install-app-btn:active {
            background: #1e293b;
        }

        #apply-btn {
            padding: 7px 16px;
            border: none;
            border-radius: 8px;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        #apply-btn:active { background: #1e293b; }

        #reader-container {
            width: 100%;
            max-width: var(--reader-width);
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1.5px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: visible;
        }

        .resize-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 24px;
            cursor: ew-resize;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        .resize-handle-left { left: -12px; }
        .resize-handle-right { right: -12px; }

        .resize-handle .handle-pill {
            width: 22px;
            height: 64px;
            background: #0f172a;
            border: 2px solid #ffffff;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 900;
            line-height: 1;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .resize-handle:hover .handle-pill,
        .resize-handle.resizing .handle-pill {
            opacity: 1;
            transform: scale(1);
        }

        #reader-container.is-resizing {
            border-color: #0f172a;
            box-shadow: 0 16px 44px rgba(15, 23, 42, 0.16);
        }

        #width-tooltip {
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            white-space: nowrap;
        }

        #width-tooltip.visible { opacity: 1; }

        #viewport {
            height: 350px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 28px;
            border-radius: 18px 18px 0 0;
            touch-action: pan-y;
        }

        .fade-top, .fade-bottom {
            position: absolute;
            left: 0;
            right: 0;
            height: 70px;
            pointer-events: none;
            z-index: 10;
        }

        .fade-top {
            top: 0;
            background: linear-gradient(to bottom, #ffffff 20%, rgba(255, 255, 255, 0));
        }

        .fade-bottom {
            bottom: 0;
            background: linear-gradient(to top, #ffffff 20%, rgba(255, 255, 255, 0));
        }

        #text-flow {
            position: absolute;
            width: calc(100% - 56px);
            left: 28px;
            top: 0;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        /* 외톨이 단어 꺾임 방지 (한글 가독성 보존) */
        .line {
            width: 100%;
            font-size: var(--font-size);
            line-height: var(--line-height);
            color: #cbd5e1;
            font-weight: 400;
            text-align: left;
            word-break: keep-all;
            overflow-wrap: break-word;
            transition: color 0.18s ease, font-weight 0.18s ease, opacity 0.18s ease;
            opacity: 0.38;
            cursor: pointer;
        }

        .line.active {
            color: #0f172a;
            font-weight: 600;
            opacity: 1;
        }

        .line.image-line {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 0;
            opacity: 0.35;
        }

        .line.image-line.active { opacity: 1; }

        .line.image-line img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08);
            background: #f8fafc;
        }

        .image-caption {
            margin-top: 6px;
            font-size: 0.78rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.4;
            max-width: 90%;
        }

        .line.image-line.active .image-caption {
            color: #475569;
            font-weight: 500;
        }

        #nav-controls {
            padding: 10px 16px;
            background: #f8fafc;
            border-top: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 11px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.95);
            background: #e2e8f0;
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #progress-counter {
            font-size: 0.82rem;
            font-weight: 600;
            color: #64748b;
            font-variant-numeric: tabular-nums;
        }

        #shuttle-wrapper {
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 10px 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-radius: 0 0 18px 18px;
        }

        .shuttle-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.74rem;
            font-weight: 600;
            color: #64748b;
        }

        #shuttle-track {
            position: relative;
            width: 100%;
            height: 40px;
            background: #f1f5f9;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: none;
            border: 1px solid #e2e8f0;
        }

        .shuttle-center-mark {
            position: absolute;
            left: 50%;
            top: 20%;
            bottom: 20%;
            width: 2px;
            background: #cbd5e1;
            transform: translateX(-50%);
            pointer-events: none;
        }

        #shuttle-thumb {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 48px;
            height: 30px;
            background: #0f172a;
            border-radius: 15px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: grab;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
        }

        #shuttle-thumb:active {
            cursor: grabbing;
            background: #1e293b;
        }

        .thumb-line {
            width: 2px;
            height: 12px;
            background: #ffffff;
            border-radius: 1px;
            opacity: 0.8;
        }

        @media (max-width: 640px) {
            :root {
                --font-size: 1.2rem;
                --line-height: 2.0;
            }

            body {
                padding: 10px 10px calc(16px + env(safe-area-inset-bottom));
            }

            #viewport {
                height: 320px;
                padding: 0 16px;
            }

            #text-flow {
                width: calc(100% - 32px);
                left: 16px;
            }

            .resize-handle {
                display: none !important;
            }

            .nav-btn {
                padding: 6px 9px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>

    <div id="input-section">
        <div class="input-header-bar">
            <span class="input-title">입력 텍스트</span>
            <button id="toggle-input-btn" class="sub-btn" style="padding: 3px 8px; font-size: 0.74rem;">접기 ▲</button>
        </div>
        <textarea id="custom-text" placeholder="기사 페이지를 복사한 후 아래 붙여넣기 버튼을 누르세요...">한 단어씩 번쩍이며 지나가는 방식은 시선 고정 효과는 있지만 오랜 시간 집중할 때 눈의 피로도와 멀미를 유발할 수 있습니다.
이제 3줄 단위로 문맥을 보존하며 읽는 새로운 몰입형 리더를 경험해 보세요.
현재 읽고 있는 3줄만 또렷한 검은색으로 포커스되고, 나머지 주변 줄글은 은은한 회색으로 흐려집니다.
기사 전체를 복사해서 [클립보드 붙여넣기]를 누르면 PC 확장 프로그램과 동일한 Readability 엔진이 본문만 깨끗하게 발라냅니다.</textarea>
        <div class="action-row">
            <button id="install-app-btn" class="sub-btn">📲 앱 설치</button>
            <button id="paste-btn" class="sub-btn">📋 클립보드 붙여넣기</button>
            <button id="apply-btn">텍스트 적용하기</button>
        </div>
    </div>

    <div id="reader-container">
        <div id="width-tooltip">760px</div>

        <div class="resize-handle resize-handle-left" id="handle-left" title="좌우로 당겨 창 너비 조절">
            <div class="handle-pill">⋮</div>
        </div>

        <div id="viewport">
            <div class="fade-top"></div>
            <div id="text-flow"></div>
            <div class="fade-bottom"></div>
        </div>

        <div id="nav-controls">
            <div class="btn-group">
                <button class="nav-btn" id="prev-3-btn">▲ 3줄</button>
                <button class="nav-btn" id="prev-1-btn">▲ 1줄</button>
                <button class="nav-btn" id="next-1-btn">▼ 1줄</button>
                <button class="nav-btn" id="next-3-btn">▼ 3줄</button>
            </div>
            <span id="progress-counter">0 / 0 줄</span>
        </div>

        <div id="shuttle-wrapper">
            <div class="shuttle-header">
                <span>◀ 이전으로</span>
                <span>정지</span>
                <span>다음으로 ▶</span>
            </div>
            <div id="shuttle-track">
                <div class="shuttle-center-mark"></div>
                <div id="shuttle-thumb">
                    <div class="thumb-line"></div>
                    <div class="thumb-line"></div>
                    <div class="thumb-line"></div>
                </div>
            </div>
        </div>

        <div class="resize-handle resize-handle-right" id="handle-right" title="좌우로 당겨 창 너비 조절">
            <div class="handle-pill">⋮</div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.log('SW registration failed: ', err);
                });
            });
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
